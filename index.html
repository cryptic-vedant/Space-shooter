<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Shooter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02010a;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const HIGH_SCORE_KEY = "spaceShooterHighScore";
    const EXPLOSION_COLORS = ["#ffd166", "#ff6b6b", "#7fe3ff", "#b388ff", "#69f0ae", "#fff59d", "#ff8a65"];

    const keys = Object.create(null);
    let score = 0;
    let highScore = Number(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
    let lives = 3;
    let gameOver = false;
    let lastTime = 0;
    let spawnTimer = 0;
    let fireCooldown = 0;
    let bossTimer = 30;
    let tripleShotTime = 0;
    let invulnTime = 0;
    let shakeTime = 0;
    let shakeMag = 0;
    let glowPulse = 0;

    const player = {
      x: 0,
      y: 0,
      w: 42,
      h: 48,
      speed: 420
    };

    const bullets = [];
    const enemies = [];
    const powerups = [];
    const stars = [];
    const particles = [];
    let boss = null;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      player.x = canvas.width / 2 - player.w / 2;
      player.y = canvas.height - player.h - 28;
    }

    function initStars() {
      stars.length = 0;
      const area = canvas.width * canvas.height;
      const layers = [
        { count: Math.max(40, Math.floor(area / 14000)), speed: 18, r: [0.4, 1.0], alpha: [0.15, 0.4] },
        { count: Math.max(30, Math.floor(area / 18000)), speed: 48, r: [0.8, 1.6], alpha: [0.35, 0.7] },
        { count: Math.max(16, Math.floor(area / 28000)), speed: 95, r: [1.2, 2.2], alpha: [0.55, 0.95] }
      ];
      for (const layer of layers) {
        for (let i = 0; i < layer.count; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: layer.r[0] + Math.random() * (layer.r[1] - layer.r[0]),
            speed: layer.speed * (0.75 + Math.random() * 0.5),
            alpha: layer.alpha[0] + Math.random() * (layer.alpha[1] - layer.alpha[0])
          });
        }
      }
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function speedTier() {
      return Math.floor(score / 100);
    }

    function enemyFallSpeed() {
      return 90 + Math.random() * 120 + speedTier() * 32;
    }

    function addScore(amount) {
      score += amount;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
      }
    }

    function screenShake(magnitude, duration) {
      shakeMag = Math.max(shakeMag, magnitude);
      shakeTime = Math.max(shakeTime, duration);
    }

    function explode(x, y, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 280;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.45 + Math.random() * 0.55,
          maxLife: 1,
          size: 2 + Math.random() * 3.5,
          color: EXPLOSION_COLORS[(Math.random() * EXPLOSION_COLORS.length) | 0]
        });
        particles[particles.length - 1].maxLife = particles[particles.length - 1].life;
      }
    }

    function spawnEnemy() {
      const w = 28 + Math.random() * 18;
      enemies.push({
        x: Math.random() * (canvas.width - w),
        y: -40,
        w: w,
        h: w,
        speed: enemyFallSpeed()
      });
    }

    function spawnBoss() {
      const w = 96;
      const h = 72;
      boss = {
        x: canvas.width / 2 - w / 2,
        y: -h,
        w: w,
        h: h,
        hp: 10,
        maxHp: 10,
        dir: Math.random() < 0.5 ? -1 : 1,
        xSpeed: 90,
        ySpeed: 22
      };
    }

    function maybeDropPowerup(x, y) {
      if (Math.random() > 0.28) return;
      powerups.push({
        x: x - 11,
        y: y - 11,
        w: 22,
        h: 22,
        speed: 120
      });
    }

    function fireBullet(offsetX) {
      bullets.push({
        x: player.x + player.w / 2 - 2.5 + offsetX,
        y: player.y - 8,
        w: 5,
        h: 14,
        speed: 620
      });
    }

    function shoot() {
      if (gameOver || fireCooldown > 0 || lives <= 0) return;
      fireCooldown = 0.18;
      if (tripleShotTime > 0) {
        fireBullet(-14);
        fireBullet(0);
        fireBullet(14);
      } else {
        fireBullet(0);
      }
    }

    function loseLife() {
      if (invulnTime > 0 || gameOver) return;
      lives -= 1;
      invulnTime = 1.6;
      screenShake(14, 0.45);
      explode(player.x + player.w / 2, player.y + player.h / 2, 22);
      if (lives <= 0) {
        gameOver = true;
        explode(player.x + player.w / 2, player.y + player.h / 2, 36);
      }
    }

    function destroyBoss() {
      explode(boss.x + boss.w / 2, boss.y + boss.h / 2, 48);
      maybeDropPowerup(boss.x + boss.w / 2, boss.y + boss.h / 2);
      addScore(100);
      screenShake(18, 0.55);
      boss = null;
      bossTimer = 30;
    }

    function resetGame() {
      score = 0;
      lives = 3;
      gameOver = false;
      bullets.length = 0;
      enemies.length = 0;
      powerups.length = 0;
      particles.length = 0;
      boss = null;
      spawnTimer = 0;
      fireCooldown = 0;
      bossTimer = 30;
      tripleShotTime = 0;
      invulnTime = 0;
      shakeTime = 0;
      shakeMag = 0;
      player.x = canvas.width / 2 - player.w / 2;
      player.y = canvas.height - player.h - 28;
    }

    function update(dt) {
      glowPulse += dt;
      for (const star of stars) {
        star.y += star.speed * dt;
        if (star.y > canvas.height) {
          star.y -= canvas.height;
          star.x = Math.random() * canvas.width;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.985;
        p.vy *= 0.985;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (shakeTime > 0) {
        shakeTime -= dt;
        if (shakeTime <= 0) {
          shakeTime = 0;
          shakeMag = 0;
        }
      }

      if (gameOver) return;

      fireCooldown = Math.max(0, fireCooldown - dt);
      invulnTime = Math.max(0, invulnTime - dt);
      tripleShotTime = Math.max(0, tripleShotTime - dt);

      const move = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
      player.x += move * player.speed * dt;
      player.x = Math.max(8, Math.min(canvas.width - player.w - 8, player.x));

      if (keys[" "]) shoot();

      for (const b of bullets) b.y -= b.speed * dt;

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = Math.max(0.32, 1.12 - speedTier() * 0.08);
      }

      bossTimer -= dt;
      if (!boss && bossTimer <= 0) spawnBoss();

      const speedBump = speedTier() * 32;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += (e.speed + speedBump) * dt;

        if (invulnTime <= 0 && rectsOverlap(e, player)) {
          enemies.splice(i, 1);
          explode(e.x + e.w / 2, e.y + e.h / 2, 18);
          loseLife();
          continue;
        }

        let hit = false;
        for (let j = bullets.length - 1; j >= 0; j--) {
          if (rectsOverlap(e, bullets[j])) {
            bullets.splice(j, 1);
            explode(e.x + e.w / 2, e.y + e.h / 2, 20);
            maybeDropPowerup(e.x + e.w / 2, e.y + e.h / 2);
            enemies.splice(i, 1);
            addScore(10);
            hit = true;
            break;
          }
        }
        if (hit) continue;
        if (e.y > canvas.height + 20) enemies.splice(i, 1);
      }

      if (boss) {
        boss.x += boss.dir * boss.xSpeed * dt;
        boss.y += boss.ySpeed * dt;
        if (boss.x <= 12) {
          boss.x = 12;
          boss.dir = 1;
        } else if (boss.x + boss.w >= canvas.width - 12) {
          boss.x = canvas.width - 12 - boss.w;
          boss.dir = -1;
        }
        if (boss.y > canvas.height * 0.28) boss.y = canvas.height * 0.28;

        for (let j = bullets.length - 1; j >= 0; j--) {
          if (rectsOverlap(boss, bullets[j])) {
            bullets.splice(j, 1);
            boss.hp -= 1;
            explode(boss.x + boss.w / 2, boss.y + boss.h / 2, 8);
            if (boss.hp <= 0) {
              destroyBoss();
              break;
            }
          }
        }

        if (boss && invulnTime <= 0 && rectsOverlap(boss, player)) {
          loseLife();
        }
      }

      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.speed * dt;
        if (rectsOverlap(p, player)) {
          tripleShotTime = 10;
          powerups.splice(i, 1);
          continue;
        }
        if (p.y > canvas.height + 20) powerups.splice(i, 1);
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        if (bullets[i].y + bullets[i].h < 0) bullets.splice(i, 1);
      }
    }

    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, "#02010a");
      g.addColorStop(0.45, "#07061a");
      g.addColorStop(1, "#0b1028");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const star of stars) {
        ctx.fillStyle = "rgba(255,255,255," + star.alpha + ")";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawShip(x, y, w, h) {
      if (invulnTime > 0 && Math.floor(invulnTime * 12) % 2 === 0) return;
      const cx = x + w / 2;
      ctx.fillStyle = tripleShotTime > 0 ? "rgba(80, 255, 140, 0.4)" : "rgba(80, 180, 255, 0.35)";
      ctx.beginPath();
      ctx.ellipse(cx, y + h - 2, 7, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#d7ecff";
      ctx.beginPath();
      ctx.moveTo(cx, y);
      ctx.lineTo(x + w, y + h - 8);
      ctx.lineTo(cx, y + h - 16);
      ctx.lineTo(x, y + h - 8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#3aa0ff";
      ctx.beginPath();
      ctx.moveTo(x + 4, y + h * 0.55);
      ctx.lineTo(x - 6, y + h - 2);
      ctx.lineTo(x + 12, y + h - 10);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + w - 4, y + h * 0.55);
      ctx.lineTo(x + w + 6, y + h - 2);
      ctx.lineTo(x + w - 12, y + h - 10);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = tripleShotTime > 0 ? "#69f0ae" : "#7fe3ff";
      ctx.fillRect(cx - 4, y + 12, 8, 10);
    }

    function drawEnemy(e) {
      const cx = e.x + e.w / 2;
      ctx.fillStyle = "#ff4d6d";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.h);
      ctx.lineTo(e.x + e.w, e.y + 8);
      ctx.lineTo(cx, e.y);
      ctx.lineTo(e.x, e.y + 8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffe066";
      ctx.beginPath();
      ctx.arc(cx, e.y + e.h * 0.42, e.w * 0.16, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBoss() {
      if (!boss) return;
      const b = boss;
      const cx = b.x + b.w / 2;
      ctx.fillStyle = "#7b2cbf";
      ctx.beginPath();
      ctx.moveTo(cx, b.y + b.h);
      ctx.lineTo(b.x + b.w, b.y + 18);
      ctx.lineTo(cx + 18, b.y);
      ctx.lineTo(cx - 18, b.y);
      ctx.lineTo(b.x, b.y + 18);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#c77dff";
      ctx.beginPath();
      ctx.moveTo(b.x + 8, b.y + 28);
      ctx.lineTo(b.x - 10, b.y + 44);
      ctx.lineTo(b.x + 22, b.y + 38);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(b.x + b.w - 8, b.y + 28);
      ctx.lineTo(b.x + b.w + 10, b.y + 44);
      ctx.lineTo(b.x + b.w - 22, b.y + 38);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      ctx.arc(cx - 16, b.y + 28, 6, 0, Math.PI * 2);
      ctx.arc(cx + 16, b.y + 28, 6, 0, Math.PI * 2);
      ctx.fill();

      const barW = b.w;
      const barH = 8;
      const barX = b.x;
      const barY = b.y - 16;
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
      ctx.fillStyle = "#3d0c0c";
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = "#ff4d6d";
      ctx.fillRect(barX, barY, barW * (b.hp / b.maxHp), barH);
    }

    function drawPowerup(p) {
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      const pulse = 1 + Math.sin(glowPulse * 8) * 0.12;
      ctx.save();
      ctx.shadowColor = "#69f0ae";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "rgba(105, 240, 174, 0.28)";
      ctx.beginPath();
      ctx.arc(cx, cy, 16 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#b9f6ca";
      ctx.beginPath();
      ctx.arc(cx, cy, 9 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#69f0ae";
      ctx.beginPath();
      ctx.arc(cx, cy, 6 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawHud() {
      ctx.fillStyle = "#e8f1ff";
      ctx.font = "22px Segoe UI, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("Score: " + score, 18, 16);
      ctx.fillStyle = "#9eb6e8";
      ctx.font = "18px Segoe UI, sans-serif";
      ctx.fillText("High: " + highScore, 18, 44);
      ctx.fillText("Lives: " + lives, 18, 68);
      if (tripleShotTime > 0) {
        ctx.fillStyle = "#69f0ae";
        ctx.fillText("Triple shot: " + tripleShotTime.toFixed(1) + "s", 18, 92);
      }
    }

    function draw() {
      ctx.save();
      if (shakeTime > 0) {
        const decay = shakeTime > 0.2 ? 1 : shakeTime / 0.2;
        ctx.translate((Math.random() - 0.5) * 2 * shakeMag * decay, (Math.random() - 0.5) * 2 * shakeMag * decay);
      }

      drawBackground();

      for (const b of bullets) {
        ctx.fillStyle = tripleShotTime > 0 ? "#b9f6ca" : "#b8f3ff";
        ctx.shadowColor = tripleShotTime > 0 ? "#69f0ae" : "#5ad6ff";
        ctx.shadowBlur = 10;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.shadowBlur = 0;
      }

      for (const p of powerups) drawPowerup(p);
      if (!gameOver) drawShip(player.x, player.y, player.w, player.h);
      for (const e of enemies) drawEnemy(e);
      drawBoss();

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.globalAlpha = 1;
      }

      ctx.restore();
      drawHud();

      if (gameOver) {
        ctx.fillStyle = "rgba(2, 1, 10, 0.55)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "bold 48px Segoe UI, sans-serif";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 36);
        ctx.font = "20px Segoe UI, sans-serif";
        ctx.fillStyle = "#c9d7ff";
        ctx.fillText("Final score: " + score, canvas.width / 2, canvas.height / 2 + 18);
        ctx.fillText("High score: " + highScore, canvas.width / 2, canvas.height / 2 + 46);
        ctx.fillText("Press Enter to play again", canvas.width / 2, canvas.height / 2 + 78);
      }
    }

    function loop(now) {
      const dt = Math.min(0.033, (now - lastTime) / 1000 || 0);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", function (e) {
      keys[e.key] = true;
      if (e.key === " " || e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault();
      }
      if (e.key === "Enter" && gameOver) resetGame();
    });

    window.addEventListener("keyup", function (e) {
      keys[e.key] = false;
    });

    window.addEventListener("resize", function () {
      const px = player.x;
      resize();
      player.x = Math.max(8, Math.min(canvas.width - player.w - 8, px));
      initStars();
    });

    resize();
    initStars();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
